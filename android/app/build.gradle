plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.koneg.checklist'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.koneg.checklist'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        koneg {
            storeFile file('koneg.jks')
            storePassword 'koneg-checklist'
            keyAlias 'koneg'
            keyPassword 'koneg-checklist'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.koneg
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
