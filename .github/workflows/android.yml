name: App Android do Check List

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar o APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nomear o arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk checklist-koneg.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Check List Koneg (versão ${{ github.run_number }})
          body: App Android do Check List da Koneg. Baixe o arquivo checklist-koneg.apk no celular e toque nele para instalar.
          files: checklist-koneg.apk
          make_latest: true
