name: App Android Koneg

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A chave de assinatura fica nos segredos do repositório (Settings > Secrets and variables > Actions).
      # Sem ela, o app é só compilado para conferir que está tudo certo, mas NÃO é publicado.
      - name: Preparar a chave de assinatura
        id: chave
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.KEYSTORE_SENHA }}
        run: |
          SENHA="$(printf '%s' "$SENHA" | tr -d ' \r\n\t')"
          echo "::notice::KEYSTORE_SENHA tem ${#SENHA} caracteres (o certo são 24)"
          if [ -n "$SENHA" ]; then
            # 1º: a chave guardada no repositório, trancada com a senha (android/koneg.jks.enc)
            # 2º: o segredo KEYSTORE_BASE64, se existir e for válido
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/koneg.jks.enc -out "$RUNNER_TEMP/koneg.jks" -pass env:SENHA 2>/dev/null; then
              printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/koneg.jks" 2>/dev/null || { echo "::error::Não consegui abrir a chave: confira o segredo KEYSTORE_SENHA (só a senha de 24 caracteres)"; exit 1; }
            fi
            keytool -list -keystore "$RUNNER_TEMP/koneg.jks" -storepass "$SENHA" >/dev/null 2>&1 || { echo "::error::A chave não abriu com a KEYSTORE_SENHA: confira se a senha e a chave são do mesmo arquivo"; exit 1; }
            echo "KONEG_KEYSTORE=$RUNNER_TEMP/koneg.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$SENHA"
            echo "KONEG_KEYSTORE_SENHA=$SENHA" >> "$GITHUB_ENV"
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Segredo KEYSTORE_SENHA ausente: compilando só para teste, sem publicar."
            keytool -genkeypair -keystore "$RUNNER_TEMP/teste.jks" -alias koneg -keyalg RSA -keysize 2048 -validity 1 \
              -storepass teste123 -keypass teste123 -dname "CN=Teste" >/dev/null
            echo "KONEG_KEYSTORE=$RUNNER_TEMP/teste.jks" >> "$GITHUB_ENV"
            echo "KONEG_KEYSTORE_SENHA=teste123" >> "$GITHUB_ENV"
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar o APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nomear o arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk checklist-koneg.apk

      - name: Publicar para download (e para a atualização automática do app)
        if: steps.chave.outputs.publicar == 'sim'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: App Koneg (versão ${{ github.run_number }})
          body_path: android/NOVIDADES.md
          files: checklist-koneg.apk
          make_latest: true
