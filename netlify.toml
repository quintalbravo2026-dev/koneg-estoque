[build]
  publish = "."
  # Gera a página do app do Check List (/checklist/) a partir do index.html
  command = "sed 's|<!--MANIFEST-->|<link rel=\"manifest\" href=\"/checklist.webmanifest\">|' index.html > checklist/index.html"

# Sempre buscar a versão mais nova da página
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/checklist.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
