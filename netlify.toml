[build]
  publish = "."
  # Não publica (e não gasta créditos) quando só mudou o app Android ou a automação do GitHub
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)android' ':(exclude).github'"
  # Gera a página do app do Check List (/checklist/) a partir do index.html
  command = "sed 's|<!--MANIFEST-->|<link rel=\"manifest\" href=\"/checklist.webmanifest\">|' index.html > checklist/index.html"

# Funções automáticas (lembrete diário de Contas a receber pelo Telegram)
[functions]
  directory = "netlify/functions"

# A chave do Firebase é pública por natureza (a proteção está nas regras do Firestore);
# o detector automático do Netlify a confunde com senha e bloqueia a publicação.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "android/**,.github/**"

# Sempre buscar a versão mais nova da página
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/checklist.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# QR code dos equipamentos: koneg.com.br/e/EQ0001 abre o histórico do equipamento no painel (ou no app)
[[redirects]]
  from = "/e/:codigo"
  to = "/painel/#eqc-:codigo"
  status = 302
  force = true

# Link curto para baixar o aplicativo do Check List (Android): koneg.com.br/app
[[redirects]]
  from = "/app"
  to = "https://github.com/quintalbravo2026-dev/koneg-estoque/releases/latest/download/checklist-koneg.apk"
  status = 302
  force = true

# Domínio koneg.com.br: a página inicial é o site institucional; o painel fica em /painel/
[[redirects]]
  from = "https://koneg.com.br/"
  to = "/site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.koneg.com.br/"
  to = "/site/index.html"
  status = 200
  force = true

# O Netlify trata /painel e /painel/ como o mesmo endereço: uma regra só, sem redirecionar
[[redirects]]
  from = "/painel"
  to = "/index.html"
  status = 200
